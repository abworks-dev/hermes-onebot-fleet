name: onebot-fleet
label: OneBot Fleet / NapCatQQ
kind: platform
version: 0.6.0
author: abworks-dev
description: Native multi-account OneBot 11 transport with strict permissions and conservative recovery
provides_tools: []
provides_hooks: []
optional_env:
  - name: ONEBOT_FLEET_ALLOWED_USERS
    description: Hermes gateway admission whitelist; must match the local allowed_users list
    password: false
  - name: ONEBOT_FLEET_HOME_CHANNEL
    description: Optional canonical proactive delivery target
    password: false
python_dependencies:
  - 'aiohttp>=3.12,<4'
