[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hermes-onebot-fleet"
version = "0.5.0"
description = "Native Hermes OneBot 11 adapter with multi-account QQ routing and conservative recovery"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [{name = "abworks-dev"}]
dependencies = ["aiohttp>=3.12,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.12,<1"]

[project.scripts]
hermes-onebot-fleet = "hermes_onebot_fleet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_onebot_fleet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
